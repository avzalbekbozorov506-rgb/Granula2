<title>Офис Авзала</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Golos+Text:wght@400;500;600&display=swap">
<style>
  /* Layout: one pixel office scene on top, status card and work log below. Single evening-office look. */
  :root {
    --bg: #161b22;
    --panel: #1f2630;
    --line: #313b48;
    --fg: #e9e4d8;
    --muted: #9aa3ae;
    --accent: #f2b544;
    --ok: #5fd08a;
    --bad: #ef6b5b;
    --info: #6cb6ff;
    --pixel: "Press Start 2P", ui-monospace, monospace;
    --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body { font-family: var(--body); font-size: 15px; line-height: 1.55; }
  .wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
  h1 { font-family: var(--pixel); font-size: clamp(14px, 3.2vw, 20px); font-weight: 400; margin: 0; letter-spacing: .02em; text-wrap: balance; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; }

  .scene { position: relative; border: 4px solid #0b0e13; border-radius: 4px; background: #0b0e13; overflow: hidden; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 192 / 112; image-rendering: pixelated; image-rendering: crisp-edges; }
  .bubble {
    position: absolute; left: 50%; top: 4%; transform: translateX(-50%);
    max-width: min(78%, 420px); background: var(--fg); color: #161b22;
    font-size: clamp(12px, 2.2vw, 14px); font-weight: 500; line-height: 1.35;
    padding: 6px 10px; border: 3px solid #0b0e13; border-radius: 2px; text-align: center;
    box-shadow: 4px 4px 0 rgba(0,0,0,.35);
  }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -11px; width: 10px; height: 10px; background: var(--fg); border: 3px solid #0b0e13; border-top: 0; border-left: 0; transform: translateX(-50%) rotate(45deg); }
  .demo-tag { position: absolute; right: 8px; bottom: 8px; font-family: var(--pixel); font-size: 9px; background: var(--accent); color: #161b22; padding: 4px 6px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .chip { font-family: var(--pixel); font-size: 10px; padding: 6px 8px; border: 2px solid currentColor; text-transform: uppercase; letter-spacing: .06em; }
  .chip[data-tone="work"] { color: var(--accent); }
  .chip[data-tone="ok"] { color: var(--ok); }
  .chip[data-tone="bad"] { color: var(--bad); }
  .chip[data-tone="idle"] { color: var(--muted); }
  .when { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .task { font-size: 17px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .summary { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; }
  .step { font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); color: var(--muted); border-radius: 2px; }
  .step.on { border-color: var(--accent); color: var(--fg); background: rgba(242,181,68,.12); }
  .step.past { color: var(--fg); }
  .step.past::before { content: "✓ "; color: var(--ok); }

  ol.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  ol.log li { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); min-width: 0; }
  ol.log li:first-child { border-top: 0; }
  ol.log time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  ol.log .txt { min-width: 0; overflow-wrap: anywhere; }
  .empty { color: var(--muted); }

  button { font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 2px solid var(--line); padding: 6px 12px; cursor: pointer; border-radius: 2px; }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
  .foot { color: var(--muted); font-size: 12px; }
</style>

<div class="wrap">
  <header>
    <h1>Офис <span>Авзала</span></h1>
    <div class="sub">Аналитик ЗПИФ коммерческой недвижимости · avzal-investor</div>
  </header>

  <div class="scene">
    <canvas id="c" width="192" height="112" aria-label="Пиксельный офис: Авзал за рабочим столом"></canvas>
    <div class="bubble" id="bubble">Жду задачу</div>
    <div class="demo-tag" id="demoTag" hidden>ДЕМО</div>
  </div>

  <section class="card" aria-live="polite">
    <div class="row">
      <span class="chip" id="chip" data-tone="idle">Свободен</span>
      <span class="when" id="when"></span>
    </div>
    <div>
      <div class="label">Задача</div>
      <div class="task" id="task">Пока задач не было. Позовите Авзала в Claude Code, и он сядет за работу.</div>
    </div>
    <div class="steps" id="steps"></div>
    <div id="sumBox" hidden>
      <div class="label">Итог</div>
      <div class="summary" id="summary"></div>
    </div>
    <div class="row">
      <button id="demoBtn" type="button">Показать, как он работает</button>
      <span class="foot" id="conn"></span>
    </div>
  </section>

  <section class="card">
    <div class="label">Журнал работы</div>
    <ol class="log" id="log"><li class="empty">Здесь появятся этапы работы: что Авзал искал, читал и считал.</li></ol>
  </section>
</div>

<script>
(() => {
  const STATES = {
    idle:    { label: "Свободен",        tone: "idle", bubble: "Жду задачу" },
    search:  { label: "Ищет данные",     tone: "work", bubble: "Смотрю котировки на Мосбирже…" },
    read:    { label: "Читает раскрытие",tone: "work", bubble: "Читаю отчёты управляющей компании…" },
    analyze: { label: "Считает",         tone: "work", bubble: "Считаю дисконт и доходность…" },
    write:   { label: "Пишет отчёт",     tone: "work", bubble: "Пишу вывод…" },
    done:    { label: "Готово",          tone: "ok",   bubble: "Отчёт готов!" },
    error:   { label: "Нужна помощь",    tone: "bad",  bubble: "Не получается, нужна помощь" },
  };
  const FLOW = ["search", "read", "analyze", "write", "done"];

  const $ = id => document.getElementById(id);
  const cv = $("c"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let live = { state: "idle", task: "", step: "", updatedAt: null, summary: "" };
  let logEntries = [];
  let demo = null;
  let shown = live;

  // ---------- drawing ----------
  const P = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };

  function sky(h) {
    if (h >= 7 && h < 17) return ["#7fb7e6", "#b9daf2"];
    if (h >= 17 && h < 20) return ["#e48a5a", "#f2c27a"];
    return ["#14203a", "#24345a"];
  }

  function drawScene(t, st) {
    const now = new Date();
    const hour = now.getHours();
    // wall + floor
    P(0, 0, 192, 72, "#33414f");
    P(0, 66, 192, 6, "#2a3642");
    P(0, 72, 192, 40, "#6b4f3a");
    for (let y = 76; y < 112; y += 6) P(0, y, 192, 1, "#5b4231");
    for (let i = 0; i < 8; i++) P((i * 29 + (i % 2) * 13) % 192, 72 + (i % 6) * 6, 1, 6, "#5b4231");

    // window
    const [s1, s2] = sky(hour);
    P(8, 8, 44, 36, "#1b222b");
    P(10, 10, 40, 32, s1); P(10, 26, 40, 16, s2);
    const night = hour < 7 || hour >= 20;
    const blds = [[11,28,7,14],[19,22,6,20],[26,30,8,12],[35,18,6,24],[42,26,7,16]];
    blds.forEach(([x,y,w,h], i) => {
      P(x, y, w, h, night ? "#0e1424" : "#4a5a70");
      for (let yy = y + 2; yy < y + h - 1; yy += 3)
        for (let xx = x + 1; xx < x + w - 1; xx += 2)
          if (((xx * 7 + yy * 3 + i) % 5) < (night ? 2 : 1)) P(xx, yy, 1, 1, night ? "#f6d77a" : "#9fb3c8");
    });
    P(29, 10, 2, 32, "#1b222b"); P(10, 25, 40, 1, "#1b222b");
    P(6, 44, 48, 3, "#24303c");

    // clock with real time
    const cx = 146, cy = 16;
    P(cx - 7, cy - 7, 15, 15, "#1b222b"); P(cx - 6, cy - 6, 13, 13, "#efe8d6");
    const m = now.getMinutes(), hh = (hour % 12) + m / 60;
    const hand = (a, len, col) => { for (let i = 0; i <= len; i++) P(Math.round(cx + Math.sin(a) * i), Math.round(cy - Math.cos(a) * i), 1, 1, col); };
    hand(hh / 12 * Math.PI * 2, 3, "#1b222b"); hand(m / 60 * Math.PI * 2, 5, "#b2442f");

    // bookshelf with fund folders
    P(160, 26, 26, 40, "#4a3526"); P(162, 28, 22, 1, "#3a281c");
    [[30, ["#b2442f","#3f7cc0","#d9a441","#3c8f5d","#7c5aa6"]],[44, ["#3f7cc0","#d9a441","#b2442f","#3c8f5d"]]].forEach(([y, cols]) => {
      cols.forEach((c, i) => P(163 + i * 4, y, 3, 11, c));
      P(162, y + 11, 22, 2, "#3a281c");
    });
    P(162, 56, 22, 8, "#3a281c");

    // plant
    P(178, 76, 10, 10, "#9a5b3a"); P(177, 74, 12, 3, "#b06a45");
    const sway = reduce ? 0 : Math.round(Math.sin(t / 900));
    [[180,66,2,9],[176+sway,62,3,8],[184-sway,64,3,7],[181,58,2,9]].forEach(([x,y,w,h]) => P(x, y, w, h, "#3c8f5d"));
    P(178+sway, 61, 2, 3, "#57b07a"); P(185-sway, 63, 2, 3, "#57b07a");

    // wall screen
    P(66, 6, 60, 36, "#0f1318"); P(68, 8, 56, 32, "#18202a");
    drawScreen(t, st, 68, 8, 56, 32);
    P(94, 42, 4, 3, "#0f1318");

    // chair back
    P(82, 44, 28, 26, "#2c2f3a"); P(84, 46, 24, 22, "#3a3e4c");

    drawPerson(t, st);

    // desk
    P(52, 70, 92, 4, "#a77a52"); P(52, 74, 92, 2, "#7d5a3c");
    P(56, 76, 84, 22, "#8b6545"); P(58, 78, 38, 18, "#7d5a3c"); P(100, 78, 38, 18, "#7d5a3c");
    P(76, 86, 4, 1, "#c9a27a"); P(116, 86, 4, 1, "#c9a27a");

    // laptop (back of lid)
    const lid = st === "idle" ? "#7d8592" : "#9aa3ae";
    P(86, 60, 20, 10, lid); P(86, 69, 20, 1, "#5d6470");
    P(95, 63, 2, 3, st === "idle" ? "#5d6470" : "#e9e4d8");

    // papers
    const stack = st === "write" ? 3 + Math.floor((t / 900) % 3) : st === "done" ? 5 : 2;
    for (let i = 0; i < stack; i++) P(60 + (i % 2), 68 - i, 16, 1, i % 2 ? "#e4ddcc" : "#f5f0e4");

    // cup + steam
    P(114, 64, 6, 6, "#e9e4d8"); P(120, 65, 2, 3, "#e9e4d8"); P(115, 65, 4, 1, "#6b4026");
    if (!reduce) for (let i = 0; i < 3; i++) {
      const ph = ((t / 400) + i * 1.3) % 4;
      if (ph < 3) P(116 + Math.round(Math.sin(t / 300 + i)), 62 - Math.floor(ph * 2), 1, 1, "rgba(233,228,216,0.6)");
    }

    // desk lamp: color tells the state
    const lampCol = { done: "#5fd08a", error: "#ef6b5b", idle: "#4a4f5a" }[st] || "#f2b544";
    P(128, 68, 8, 2, "#2c2f3a"); P(131, 58, 2, 10, "#2c2f3a"); P(127, 55, 10, 4, "#2c2f3a");
    P(128, 59, 8, 1, lampCol);
    if (st !== "idle") { ctx.fillStyle = lampCol + "22"; ctx.beginPath(); ctx.moveTo(128, 60); ctx.lineTo(136, 60); ctx.lineTo(142, 70); ctx.lineTo(122, 70); ctx.fill(); }
  }

  function drawPerson(t, st) {
    const skin = "#e0a77a", hair = "#2a1d17", shirt = "#3f7cc0", collar = "#e9e4d8";
    const bob = reduce ? 0 : (st === "done" ? Math.round(Math.abs(Math.sin(t / 180)) * -2) : Math.round(Math.sin(t / 700) * 0.6));
    const y0 = 42 + bob;
    // body
    P(86, y0 + 15, 20, 14, shirt); P(94, y0 + 15, 4, 3, collar); P(95, y0 + 18, 2, 5, "#24303c");
    // head
    P(90, y0, 12, 14, skin); P(89, y0 + 5, 1, 4, skin); P(102, y0 + 5, 1, 4, skin);
    P(90, y0 - 1, 12, 4, hair); P(89, y0, 2, 5, hair); P(101, y0, 2, 4, hair);
    // face glow from laptop while working
    if (["search","read","analyze","write"].includes(st)) { ctx.fillStyle = "rgba(108,182,255,0.12)"; ctx.fillRect(90, y0 + 6, 12, 8); }
    // eyes
    const blink = !reduce && (t % 4200) < 140;
    const look = st === "analyze" ? -1 : st === "read" ? 0 : 0;
    if (st === "idle" && (t % 9000) > 6000) { P(92, y0 + 7, 3, 1, "#1b222b"); P(97, y0 + 7, 3, 1, "#1b222b"); }
    else if (blink) { P(92, y0 + 7, 2, 1, "#1b222b"); P(98, y0 + 7, 2, 1, "#1b222b"); }
    else {
      P(92, y0 + 6 + look, 2, 2, "#1b222b"); P(98, y0 + 6 + look, 2, 2, "#1b222b");
    }
    // mouth
    if (st === "done") { P(94, y0 + 11, 4, 1, "#7a3b2a"); P(93, y0 + 10, 1, 1, "#7a3b2a"); P(98, y0 + 10, 1, 1, "#7a3b2a"); }
    else if (st === "error") { P(94, y0 + 11, 4, 1, "#7a3b2a"); P(93, y0 + 12, 1, 1, "#7a3b2a"); P(98, y0 + 12, 1, 1, "#7a3b2a"); }
    else P(95, y0 + 11, 2, 1, "#7a3b2a");

    // arms
    const typing = st === "search" || st === "write";
    const speed = st === "write" ? 110 : 160;
    if (st === "done") {
      const up = reduce ? 0 : Math.round(Math.sin(t / 180));
      P(82, y0 + 4 + up, 4, 13, shirt); P(82, y0 + 1 + up, 4, 3, skin);
      P(106, y0 + 4 - up, 4, 13, shirt); P(106, y0 + 1 - up, 4, 3, skin);
    } else if (st === "read") {
      // holding a fund report in front of the chest
      P(84, y0 + 18, 4, 8, shirt); P(104, y0 + 18, 4, 8, shirt);
      P(88, y0 + 11, 16, 8, "#f5f0e4"); P(88, y0 + 11, 16, 1, "#d9d2c0");
      const hl = reduce ? 2 : Math.floor(t / 600) % 3;
      for (let i = 0; i < 3; i++) P(90, y0 + 13 + i * 2, i === 2 ? 7 : 12, 1, i === hl ? "#f2b544" : "#9aa3ae");
      P(87, y0 + 14, 2, 3, skin); P(103, y0 + 14, 2, 3, skin);
    } else if (st === "analyze" || st === "error") {
      // hand to chin / scratching head
      P(84, y0 + 18, 4, 9, shirt); P(84, y0 + 26, 4, 2, skin);
      const scratch = st === "error" && !reduce ? Math.round(Math.sin(t / 120)) : 0;
      const hy = st === "error" ? y0 - 1 + scratch : y0 + 11;
      P(104, hy + 3, 4, y0 + 18 - hy, shirt); P(102, hy, 4, 3, skin);
    } else {
      const l = typing && !reduce ? (Math.floor(t / speed) % 2) : 0;
      P(83, y0 + 17, 4, 8, shirt); P(105, y0 + 17, 4, 8, shirt);
      P(84, y0 + 24 - l, 4, 3, skin); P(104, y0 + 24 - (typing ? 1 - l : 0), 4, 3, skin);
    }

    // thought dots
    if (st === "analyze" && !reduce) {
      const n = Math.floor(t / 400) % 4;
      for (let i = 0; i < n; i++) P(106 + i * 3, y0 - 3 - i * 2, 2, 2, "#e9e4d8");
    }
    if (st === "idle" && (t % 9000) > 6000 && !reduce) {
      const z = Math.floor(t / 500) % 3;
      P(105 + z * 2, y0 - 2 - z * 3, 3, 1, "#9aa3ae"); P(107 + z * 2, y0 - 1 - z * 3, 1, 1, "#9aa3ae"); P(105 + z * 2, y0 - z * 3, 3, 1, "#9aa3ae");
    }
  }

  function drawScreen(t, st, x, y, w, h) {
    if (st === "idle") {
      const bx = x + 4 + Math.abs(((t / 60) % ((w - 10) * 2)) - (w - 10));
      const by = y + 4 + Math.abs(((t / 90) % ((h - 10) * 2)) - (h - 10));
      P(Math.round(bx), Math.round(by), 3, 3, "#3a4656");
      return;
    }
    if (st === "search") {
      P(x + 2, y + 2, w - 4, 4, "#e9e4d8"); P(x + 3, y + 3, 10, 2, "#6cb6ff");
      P(x + 15, y + 3, Math.floor((t / 120) % 30), 2, "#1b222b");
      // ticker tape of fund quotes
      const off = Math.floor(t / 70);
      for (let i = 0; i < 9; i++) {
        const xx = x + 2 + ((i * 9 - off) % (w - 4) + (w - 4)) % (w - 4);
        const up = (i * 7) % 3 !== 0;
        P(xx, y + 9, 6, 2, "#9aa3ae"); P(xx, y + 12, 3, 1, up ? "#5fd08a" : "#ef6b5b");
      }
      for (let r = 0; r < 4; r++) P(x + 3, y + 17 + r * 4, 10 + ((r * 13 + Math.floor(t / 500)) % 34), 2, r === 0 ? "#6cb6ff" : "#5d6470");
      return;
    }
    if (st === "read") {
      P(x + 14, y + 2, 28, h - 4, "#f5f0e4");
      const hl = Math.floor(t / 600) % 6;
      for (let i = 0; i < 6; i++) P(x + 17, y + 6 + i * 4, i % 3 === 2 ? 14 : 22, 1, i === hl ? "#f2b544" : "#9aa3ae");
      return;
    }
    if (st === "analyze") {
      P(x + 3, y + h - 4, w - 6, 1, "#5d6470"); P(x + 3, y + 3, 1, h - 7, "#5d6470");
      const grow = reduce ? 1 : Math.min(1, ((t % 3000) / 1500));
      const bars = [10, 14, 12, 18, 16, 22];
      bars.forEach((b, i) => P(x + 7 + i * 7, y + h - 4 - Math.round(b * grow), 4, Math.round(b * grow), i === 5 ? "#f2b544" : "#3f7cc0"));
      P(x + 4, y + 9, w - 8, 1, "rgba(239,107,91,0.8)");
      return;
    }
    if (st === "write") {
      const rows = reduce ? 6 : 1 + Math.floor((t / 450) % 7);
      P(x + 3, y + 3, w - 6, 3, "#3f7cc0");
      for (let i = 0; i < rows - 1; i++) {
        P(x + 3, y + 8 + i * 4, 16, 2, "#9aa3ae");
        P(x + 22, y + 8 + i * 4, 10, 2, "#e9e4d8");
        P(x + 35, y + 8 + i * 4, 8, 2, i % 2 ? "#ef6b5b" : "#5fd08a");
      }
      if (Math.floor(t / 400) % 2) P(x + 3, y + 8 + (rows - 1) * 4, 2, 2, "#e9e4d8");
      return;
    }
    if (st === "done") {
      const c = "#5fd08a";
      [[18,16],[20,18],[22,20],[24,18],[26,16],[28,14],[30,12],[32,10],[34,8]].forEach(([dx, dy]) => P(x + dx, y + dy + 2, 3, 3, c));
      return;
    }
    if (st === "error") {
      for (let i = 0; i < 12; i++) { P(x + 22 + i, y + 10 + i, 2, 2, "#ef6b5b"); P(x + 33 - i, y + 10 + i, 2, 2, "#ef6b5b"); }
    }
  }

  // ---------- panel ----------
  function ago(iso) {
    if (!iso) return "";
    const d = new Date(iso); if (isNaN(d)) return "";
    const s = Math.max(0, Math.round((Date.now() - d) / 1000));
    if (s < 60) return "обновлено только что";
    if (s < 3600) return `обновлено ${Math.floor(s / 60)} мин назад`;
    if (s < 86400) return `обновлено ${Math.floor(s / 3600)} ч назад`;
    return "обновлено " + d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
  }

  function render() {
    const s = shown;
    const def = STATES[s.state] || STATES.idle;
    $("chip").textContent = def.label;
    $("chip").dataset.tone = def.tone;
    $("bubble").textContent = s.step || def.bubble;
    $("when").textContent = demo ? "демонстрация" : ago(s.updatedAt);
    $("task").textContent = s.task || "Пока задач не было. Позовите Авзала в Claude Code, и он сядет за работу.";
    $("sumBox").hidden = !s.summary;
    $("summary").textContent = s.summary || "";
    const steps = $("steps"); steps.textContent = "";
    const idx = FLOW.indexOf(s.state);
    if (idx >= 0) FLOW.forEach((k, i) => {
      const el = document.createElement("span");
      el.className = "step" + (i === idx ? " on" : i < idx ? " past" : "");
      el.textContent = STATES[k].label;
      steps.appendChild(el);
    });
    $("demoTag").hidden = !demo;
    const list = demo ? demo.log : logEntries;
    const ol = $("log"); ol.textContent = "";
    if (!list.length) {
      const li = document.createElement("li"); li.className = "empty";
      li.textContent = "Здесь появятся этапы работы: что Авзал искал, читал и считал.";
      ol.appendChild(li);
    } else list.slice(0, 40).forEach(e => {
      const li = document.createElement("li");
      const tm = document.createElement("time");
      const d = new Date(e.t);
      tm.textContent = isNaN(d) ? "" : d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      const tx = document.createElement("span"); tx.className = "txt";
      tx.textContent = (STATES[e.state] ? STATES[e.state].label + ": " : "") + (e.text || "");
      li.append(tm, tx); ol.appendChild(li);
    });
  }

  // ---------- demo ----------
  const DEMO = [
    ["search",  "Смотрю котировки паёв на Мосбирже…"],
    ["search",  "Проверяю, какие фонды доступны неквалу…"],
    ["read",    "Читаю отчёт УК: СЧА, арендаторы, долг…"],
    ["analyze", "Считаю дисконт к расчётной стоимости пая…"],
    ["write",   "Пишу вывод и таблицу с источниками…"],
    ["done",    "Отчёт готов!"],
  ];
  function startDemo() {
    clearTimeout(demo && demo.timer);
    demo = { i: 0, log: [], timer: null };
    const tick = () => {
      if (demo.i >= DEMO.length) { demo.timer = setTimeout(() => { demo = null; shown = live; render(); }, 2500); return; }
      const [state, step] = DEMO[demo.i++];
      demo.log.unshift({ t: new Date().toISOString(), state, text: step });
      shown = { state, step, task: "Пример: какой ЗПИФ коммерческой недвижимости купить, горизонт 3 года", summary: state === "done" ? "Это демонстрация. Настоящий отчёт появится здесь, когда вы позовёте Авзала." : "", updatedAt: null };
      render();
      demo.timer = setTimeout(tick, 2600);
    };
    tick();
  }
  $("demoBtn").addEventListener("click", startDemo);

  // ---------- live data ----------
  async function connect() {
    let db = null;
    try { db = await window.claude?.use?.("db"); } catch (_) {}
    if (!db) { $("conn").textContent = "Нет связи с офисом, показываю последнее известное состояние."; return; }
    $("conn").textContent = "На связи";
    db.doc("office/status").onSnapshot(snap => {
      if (snap.exists) live = Object.assign({ state: "idle", task: "", step: "", summary: "", updatedAt: null }, snap.data());
      if (!demo) { shown = live; render(); }
    }, () => { $("conn").textContent = "Связь с офисом прервалась, обновите страницу."; });
    db.doc("office/log").onSnapshot(snap => {
      logEntries = snap.exists && Array.isArray(snap.data().entries) ? snap.data().entries : [];
      if (!demo) render();
    }, () => {});
  }

  // ---------- loop ----------
  function frame(t) { drawScene(t, shown.state in STATES ? shown.state : "idle"); requestAnimationFrame(frame); }
  render();
  requestAnimationFrame(frame);
  setInterval(() => { if (!demo) $("when").textContent = ago(shown.updatedAt); }, 30000);
  connect();
})();
</script>
