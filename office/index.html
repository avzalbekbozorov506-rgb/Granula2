<title>Офис Авзала</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Golos+Text:wght@400;500;600&display=swap">
<style>
  /* Layout: wide pixel office with three desks on top; team cards, the task chain and the shared work log below. Single night-office look. */
  :root {
    --bg: #11151c;
    --panel: #1a212b;
    --panel-2: #212a36;
    --line: #2d3846;
    --fg: #ece6d8;
    --muted: #96a0ad;
    --accent: #f2b544;
    --ok: #5fd08a;
    --bad: #ef6b5b;
    --info: #6cb6ff;
    --avzal: #6cb6ff;
    --vika: #ec93d4;
    --khomyak: #f0a35a;
    --ink: #0b0e13;
    --paper: #ece6d8;
    --pixel: "Press Start 2P", ui-monospace, monospace;
    --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body { font-family: var(--body); font-size: 15px; line-height: 1.55; }
  .wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
  h1 { font-family: var(--pixel); font-size: clamp(14px, 3.2vw, 22px); font-weight: 400; margin: 0; letter-spacing: .02em; text-wrap: balance; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; min-width: 0; }
  .sub b { font-weight: 600; }

  .scene { position: relative; border: 4px solid var(--ink); border-radius: 4px; background: var(--ink); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  canvas#c { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 2 / 1; image-rendering: pixelated; image-rendering: crisp-edges; }
  .tag {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%);
    font-family: var(--pixel); font-size: clamp(6px, 1.25vw, 9px); line-height: 1;
    padding: 3px 4px; background: rgba(11,14,19,.78); color: var(--who);
    white-space: nowrap; pointer-events: none; border-radius: 2px;
  }
  .bubble {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%);
    width: max-content; max-width: min(46%, 300px); background: var(--paper); color: #161b22;
    font-size: clamp(10px, 1.9vw, 13px); font-weight: 500; line-height: 1.3;
    padding: 5px 8px; border: 3px solid var(--ink); border-radius: 2px; text-align: center;
    box-shadow: 3px 3px 0 rgba(0,0,0,.35); pointer-events: none;
  }
  .bubble b { color: var(--whoDark); font-weight: 600; }
  .demo-tag { position: absolute; right: 8px; bottom: 8px; font-family: var(--pixel); font-size: 9px; background: var(--accent); color: #161b22; padding: 4px 6px; }

  .team { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .mate { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--who); border-radius: 6px; padding: 12px 14px; display: grid; grid-template-columns: 56px 1fr; gap: 4px 12px; align-items: start; min-width: 0; }
  .mate canvas { grid-row: span 3; width: 56px; height: 56px; image-rendering: pixelated; background: var(--panel-2); border-radius: 4px; }
  .mate .nm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-width: 0; }
  .mate .nm strong { font-family: var(--pixel); font-size: 11px; font-weight: 400; color: var(--who); }
  .mate .role { color: var(--muted); font-size: 12px; }
  .mate .now { font-size: 13px; min-width: 0; overflow-wrap: anywhere; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .chip { font-family: var(--pixel); font-size: 9px; padding: 5px 7px; border: 2px solid currentColor; text-transform: uppercase; letter-spacing: .06em; justify-self: start; width: max-content; }
  .chip[data-tone="work"] { color: var(--accent); }
  .chip[data-tone="ok"] { color: var(--ok); }
  .chip[data-tone="bad"] { color: var(--bad); }
  .chip[data-tone="idle"] { color: var(--muted); }
  .when { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .task { font-size: 17px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .summary { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }

  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 2px; color: var(--muted); }
  .link i { font-style: normal; font-family: var(--pixel); font-size: 9px; }
  .link[data-s="work"] { border-color: var(--accent); color: var(--fg); background: rgba(242,181,68,.10); }
  .link[data-s="work"] i { color: var(--accent); }
  .link[data-s="ok"] { color: var(--fg); }
  .link[data-s="ok"] i { color: var(--ok); }
  .link[data-s="bad"] { border-color: var(--bad); color: var(--fg); }
  .link[data-s="bad"] i { color: var(--bad); }
  .arrow { color: var(--muted); font-size: 13px; }

  ol.log { list-style: none; margin: 0; padding: 0; display: grid; }
  ol.log li { display: grid; grid-template-columns: 50px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); min-width: 0; }
  ol.log li:first-child { border-top: 0; }
  ol.log time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  ol.log .txt { min-width: 0; overflow-wrap: anywhere; }
  ol.log .who { font-weight: 600; color: var(--who); }
  ol.log .st { color: var(--muted); }
  .empty { color: var(--muted); }

  button { font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 2px solid var(--line); padding: 6px 12px; cursor: pointer; border-radius: 2px; }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
  .foot { color: var(--muted); font-size: 12px; }
</style>

<div class="wrap">
  <header>
    <h1>Офис <span>Авзала</span></h1>
    <div class="sub">Команда ЗПИФ: <b style="color:var(--avzal)">Авзал</b> ищет фонды, <b style="color:var(--vika)">Вика</b> проверяет, <b style="color:var(--khomyak)">Хомяк</b> считает портфель</div>
  </header>

  <div class="scene" id="scene">
    <canvas id="c" width="288" height="144" aria-label="Пиксельный офис: Авзал, Вика и Хомяк за работой"></canvas>
    <div class="demo-tag" id="demoTag" hidden>ДЕМО</div>
  </div>

  <section class="team" id="team" aria-live="polite"></section>

  <section class="card">
    <div class="row">
      <span class="chip" id="chip" data-tone="idle">Свободны</span>
      <span class="when" id="when"></span>
    </div>
    <div>
      <div class="label">Задача</div>
      <div class="task" id="task"></div>
    </div>
    <div class="chain" id="chain"></div>
    <div id="sumBox" hidden>
      <div class="label">Итог</div>
      <div class="summary" id="summary"></div>
    </div>
    <div class="row">
      <button id="demoBtn" type="button">Показать, как работает команда</button>
      <span class="foot" id="conn"></span>
    </div>
  </section>

  <section class="card">
    <div class="label">Журнал работы</div>
    <ol class="log" id="log"></ol>
  </section>
</div>

<script>
(() => {
  // ---------- team and states ----------
  const W = 288, H = 144, LANE = 126, SEAT_TOP = 70;
  const STATES = {
    idle:    { label: "Свободен",     tone: "idle" },
    search:  { label: "Ищет",         tone: "work" },
    read:    { label: "Читает",       tone: "work" },
    analyze: { label: "Считает",      tone: "work" },
    write:   { label: "Пишет",        tone: "work" },
    done:    { label: "Готово",       tone: "ok" },
    error:   { label: "Нужна помощь", tone: "bad" },
  };
  const WORK = ["search", "read", "analyze", "write"];
  const TEAM = [
    { id: "avzal",   name: "Авзал", role: "Аналитик ЗПИФ",        does: "Ищет и разбирает фонды", seat: 144, color: "var(--avzal)",   dark: "#2f6fb0", fem: false },
    { id: "vika",    name: "Вика",  role: "Ревизор",              does: "Проверяет цифры по первоисточникам", seat: 40, color: "var(--vika)", dark: "#a1347f", fem: true },
    { id: "khomyak", name: "Хомяк", role: "Портфельный менеджер", does: "Ведёт портфель и план покупок", seat: 248, color: "var(--khomyak)", dark: "#b0611c", fem: false },
  ];
  const BY = Object.fromEntries(TEAM.map(a => [a.id, a]));
  const LINES = {
    avzal:   { search: "Смотрю котировки на Мосбирже…", read: "Беру с полки отчёты УК…", analyze: "Рисую дисконты на флипчарте…", write: "Пишу вывод…", done: "Отчёт готов! Несу Вике", error: "Не получается, нужна помощь" },
    vika:    { search: "Ищу первоисточники…", read: "Сверяю цифры под лупой…", analyze: "Пересчитываю дисконт и доходность…", write: "Пишу вердикт…", done: "Проверила! Передаю Хомяку", error: "Цифры не сходятся…" },
    khomyak: { search: "Смотрю цены паёв…", read: "Открываю портфель…", analyze: "Считаю доли и выплаты…", write: "Составляю план покупок…", done: "План готов!", error: "Не хватает данных…" },
  };
  const STYLE = {
    avzal:   { skin: "#e0a77a", hair: "#2a1d17", top: "#3f7cc0", pants: "#2c2f3a", shoe: "#15181d" },
    vika:    { skin: "#f0c09a", hair: "#8a3b2a", top: "#a14f8f", pants: "#3a3e4c", shoe: "#5a2340" },
    khomyak: { skin: "#e8b48a", hair: "#d39248", top: "#d39248", pants: "#4a5a70", shoe: "#15181d" },
  };
  const SPOTS = { flip: [68, 123], cooler: [178, 123], printer: [212, 128], shelf: [236, 127], window: [30, 128], user: [144, 136] };

  const $ = id => document.getElementById(id);
  const cv = $("c"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let g = ctx;
  const P = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- data ----------
  let live = { state: "idle", task: "", step: "", summary: "", updatedAt: null, agent: "avzal", agents: null };
  let logEntries = [];
  let demo = null;
  let shown = live;

  function agentsOf(s) {
    const a = {};
    TEAM.forEach(m => a[m.id] = { state: "idle", step: "" });
    if (s.agents && typeof s.agents === "object") {
      TEAM.forEach(m => { const v = s.agents[m.id]; if (v && STATES[v.state]) a[m.id] = { state: v.state, step: v.step || "" }; });
    } else if (STATES[s.state]) a.avzal = { state: s.state, step: s.step || "" };
    return a;
  }
  function whoOf(e) {
    if (e.who && BY[e.who]) return { who: e.who, text: e.text || "" };
    const m = /^(Вика|Хомяк|Авзал):\s*/.exec(e.text || "");
    if (m) return { who: TEAM.find(a => a.name === m[1]).id, text: e.text.slice(m[0].length) };
    return { who: "avzal", text: e.text || "" };
  }

  // ---------- characters: walking brains ----------
  const chars = TEAM.map(a => ({ id: a.id, seat: a.seat, x: a.seat, y: LANE, seated: true, pose: "sit", face: 0, plan: [], cur: null, st: "idle", doneAt: 0 }));
  const SEAT = { go: "seat" };

  function handoffSpot(id) {
    if (id === "avzal") return [BY.vika.seat + 6, 129];
    if (id === "vika") return [BY.khomyak.seat - 6, 129];
    return SPOTS.user;
  }
  function planFor(c, st, prev) {
    switch (st) {
      case "search":  return [SEAT, { pose: "type", dur: Infinity }];
      case "read":    return [{ go: SPOTS.shelf }, { pose: "reach", dur: 1800 }, SEAT, { pose: "read", dur: Infinity }];
      case "analyze": return [{ go: SPOTS.flip }, { pose: "draw", dur: Infinity, face: 1 }];
      case "write":   return [SEAT, { pose: "write", dur: Infinity }];
      case "error":   return [SEAT, { pose: "error", dur: Infinity }];
      case "done":
        if (WORK.includes(prev)) return [{ go: handoffSpot(c.id), carry: true }, { pose: "give", dur: 1700 }, SEAT, { pose: "cheer", dur: 2200 }, { pose: "happy", dur: 5000 }];
        return [SEAT, { pose: "happy", dur: 4000 }];
      default: return [];
    }
  }
  function wander(c) {
    const others = TEAM.filter(a => a.id !== c.id);
    const mate = others[Math.floor(Math.random() * others.length)];
    const j = () => Math.round(rand(-6, 6));
    const opts = [
      [3, [SEAT, { pose: "sit", dur: rand(4000, 8000) }]],
      [2, [{ go: [SPOTS.cooler[0] + j(), SPOTS.cooler[1]] }, { pose: "sip", dur: rand(3000, 5000) }]],
      [1, [{ go: [SPOTS.window[0] + j(), SPOTS.window[1]] }, { pose: "look", dur: rand(2500, 4000) }]],
      [1, [{ go: [SPOTS.printer[0] + j(), SPOTS.printer[1]] }, { pose: "stand", dur: rand(2000, 3000) }]],
      [1, [{ go: [SPOTS.shelf[0] + j(), SPOTS.shelf[1]] }, { pose: "reach", dur: 1500 }]],
      [2, [{ go: [mate.seat + (mate.seat < c.seat ? 10 : -10), 129] }, { pose: "chat", dur: rand(2500, 4000) }]],
    ];
    let r = Math.random() * opts.reduce((s, o) => s + o[0], 0);
    for (const [w, items] of opts) { if ((r -= w) <= 0) return items.map(i => ({ ...i })); }
    return opts[0][1].map(i => ({ ...i }));
  }
  function setState(c, st) {
    if (st === c.st) return;
    const prev = c.st; c.st = st;
    if (st === "done") c.doneAt = performance.now();
    c.plan = planFor(c, st, prev).map(i => ({ ...i }));
    c.cur = null;
  }
  function stepChar(c, dt, now) {
    if (!c.cur) {
      c.cur = c.plan.shift() || null;
      if (!c.cur) { c.plan = wander(c); c.cur = c.plan.shift(); }
      c.cur.start = null;
    }
    const it = c.cur;
    if (it.go) {
      const isSeat = it.go === "seat";
      if (isSeat && c.seated) { c.cur = null; return; }
      const [tx, ty] = isSeat ? [c.seat, LANE] : it.go;
      if (c.seated) { c.seated = false; c.x = c.seat; c.y = LANE; }
      c.pose = it.carry ? "carry" : "walk";
      if (reduce) { c.x = tx; c.y = ty; }
      const sp = 36 * dt / 1000;
      const dx = tx - c.x, dy = ty - c.y;
      if (Math.abs(dx) > 0.5) { c.x += Math.sign(dx) * Math.min(sp, Math.abs(dx)); c.face = Math.sign(dx); }
      else if (Math.abs(dy) > 0.5) { c.x = tx; c.y += Math.sign(dy) * Math.min(sp, Math.abs(dy)); c.face = 0; }
      else { c.x = tx; c.y = ty; c.face = 0; if (isSeat) c.seated = true; c.cur = null; }
    } else {
      if (it.start == null) it.start = now;
      c.pose = it.pose; c.face = it.face || 0;
      if (now - it.start >= it.dur) c.cur = null;
    }
  }

  // ---------- drawing: room ----------
  function sky(h) {
    if (h >= 7 && h < 17) return ["#7fb7e6", "#b9daf2"];
    if (h >= 17 && h < 20) return ["#e48a5a", "#f2c27a"];
    return ["#14203a", "#24345a"];
  }
  function drawRoom(t, A) {
    const now = new Date(), hour = now.getHours();
    P(0, 0, W, 80, "#33414f");
    for (let x = 6; x < W; x += 16) P(x, 0, 1, 76, "#2f3c49");
    P(0, 76, W, 4, "#26313c");
    P(0, 80, W, 64, "#6b4f3a");
    for (let y = 86; y < H; y += 7) P(0, y, W, 1, "#5b4231");
    for (let i = 0; i < 14; i++) P((i * 37 + (i % 3) * 11) % W, 80 + (i % 9) * 7, 1, 7, "#5b4231");
    // rug in front of Avzal
    P(112, 122, 64, 18, "#2f4a4f"); P(114, 124, 60, 14, "#36565c"); P(116, 126, 56, 10, "#2f4a4f");

    // window above Vika
    const [s1, s2] = sky(hour), night = hour < 7 || hour >= 20;
    P(14, 8, 48, 36, "#1b222b"); P(16, 10, 44, 32, s1); P(16, 26, 44, 16, s2);
    [[17,28,7,14],[25,22,6,20],[32,30,8,12],[41,18,6,24],[48,26,7,16],[55,31,5,11]].forEach(([x,y,w,h], i) => {
      P(x, y, w, h, night ? "#0e1424" : "#4a5a70");
      for (let yy = y + 2; yy < y + h - 1; yy += 3)
        for (let xx = x + 1; xx < x + w - 1; xx += 2)
          if (((xx * 7 + yy * 3 + i) % 5) < (night ? 2 : 1)) P(xx, yy, 1, 1, night ? "#f6d77a" : "#9fb3c8");
    });
    P(37, 10, 2, 32, "#1b222b"); P(16, 25, 44, 1, "#1b222b"); P(12, 44, 52, 3, "#24303c");

    // clock with real time
    const cx = 92, cy = 18;
    P(cx - 7, cy - 7, 15, 15, "#1b222b"); P(cx - 6, cy - 6, 13, 13, "#efe8d6");
    const m = now.getMinutes(), hh = (hour % 12) + m / 60;
    const hand = (a, len, col) => { for (let i = 0; i <= len; i++) P(cx + Math.sin(a) * i, cy - Math.cos(a) * i, 1, 1, col); };
    hand(hh / 12 * Math.PI * 2, 3, "#1b222b"); hand(m / 60 * Math.PI * 2, 5, "#b2442f");

    // small framed chart between window and screen
    P(80, 34, 26, 18, "#1b222b"); P(82, 36, 22, 14, "#efe8d6");
    [[84,46],[88,44],[92,45],[96,41],[100,39]].forEach(([x, y]) => P(x, y, 2, 2, "#3c8f5d"));

    // wall screen above Avzal: his live activity
    P(118, 6, 52, 36, "#0f1318"); P(120, 8, 48, 32, "#18202a");
    drawScreen(t, A.avzal.state, 120, 8, 48, 32);
    P(142, 42, 4, 3, "#0f1318");

    // bookshelf above Khomyak
    P(226, 8, 44, 48, "#4a3526"); P(228, 10, 40, 1, "#3a281c");
    [[12, ["#b2442f","#3f7cc0","#d9a441","#3c8f5d","#7c5aa6","#b2442f","#d9a441","#3f7cc0"]],
     [27, ["#3f7cc0","#d9a441","#b2442f","#3c8f5d","#3f7cc0","#7c5aa6"]]].forEach(([y, cols]) => {
      cols.forEach((c, i) => P(229 + i * 4.6, y, 3, 12, c));
      P(228, y + 12, 40, 2, "#3a281c");
    });
    // hamster cage on the shelf (Khomyak's pet)
    P(230, 43, 18, 11, "#3a281c");
    for (let x = 230; x < 248; x += 3) P(x, 43, 1, 11, "#9aa3ae");
    P(230, 43, 18, 1, "#9aa3ae");
    const wheel = reduce ? 0 : Math.floor(t / 150) % 4;
    P(240, 46, 6, 6, "#5d6470"); P(241 + (wheel % 2) * 3, 47 + (wheel > 1 ? 3 : 0), 2, 2, "#d9a441");
    P(232, 50, 4, 3, "#d39248"); P(233, 50, 1, 1, "#1b222b");
    P(252, 43, 16, 11, "#3a281c"); P(254, 45, 5, 8, "#d9a441"); P(260, 45, 6, 8, "#b2442f");

    // chairs
    TEAM.forEach(a => { P(a.seat - 11, 72, 22, 22, "#2c2f3a"); P(a.seat - 9, 74, 18, 18, "#3a3e4c"); });
  }

  // flipchart, cooler, printer: floor props behind the walking lane
  const flip = { who: "avzal", p: 0.6 };
  function drawProps(t, A) {
    // flipchart
    P(80, 98, 2, 24, "#5d6470"); P(102, 98, 2, 24, "#5d6470"); P(91, 98, 2, 22, "#5d6470");
    P(76, 64, 32, 36, "#3a3e4c"); P(78, 66, 28, 32, "#efe8d6");
    P(76, 62, 32, 3, "#5d6470");
    const p = Math.min(1, flip.p), x = 78, y = 66;
    if (flip.who === "vika") {
      for (let i = 0; i < 5; i++) {
        if (p < (i + 1) / 5) break;
        P(x + 3, y + 4 + i * 6, 14, 1, "#9aa3ae");
        if (i === 2) { P(x + 20, y + 2 + i * 6, 1, 1, "#ef6b5b"); P(x + 22, y + 4 + i * 6, 1, 1, "#ef6b5b"); P(x + 21, y + 3 + i * 6, 1, 1, "#ef6b5b"); P(x + 22, y + 2 + i * 6, 1, 1, "#ef6b5b"); P(x + 20, y + 4 + i * 6, 1, 1, "#ef6b5b"); }

      if (!show) { bb.hidden = true; return; }
      const text = A[c.id].step || LINES[c.id][st] || "";
      if (bb.dataset.text !== text) { bb.dataset.text = text; bb.textContent = text; }
      bb.hidden = false;
      const bw = bb.offsetWidth, half = bw / 2 + 4;
      const bx = Math.max(half, Math.min(cw - half, x));
      bb.style.left = bx + "px"; bb.style.top = Math.max(bb.offsetHeight + 4, tagY - tg.offsetHeight - 4) + "px";
    });
  }

  // ---------- panel ----------
  function ago(iso) {
    if (!iso) return "";
    const d = new Date(iso); if (isNaN(d)) return "";
    const s = Math.max(0, Math.round((Date.now() - d) / 1000));
    if (s < 60) return "обновлено только что";
    if (s < 3600) return `обновлено ${Math.floor(s / 60)} мин назад`;
    if (s < 86400) return `обновлено ${Math.floor(s / 3600)} ч назад`;
    return "обновлено " + d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
  }
  function stateLabel(st, fem) {
    if (st === "idle") return fem ? "Свободна" : "Свободен";
    return STATES[st].label;
  }

  // team cards with small portraits
  const cards = {};
  TEAM.forEach(a => {
    const el = document.createElement("article"); el.className = "mate"; el.style.setProperty("--who", a.color);
    const pc = document.createElement("canvas"); pc.width = 20; pc.height = 20; pc.setAttribute("aria-hidden", "true");
    const pg = pc.getContext("2d"); const keep = g; g = pg; P(0, 0, 20, 20, "#212a36"); person(a.id, 10, 4, "stand", 0, 0, false); g = keep;
    const nm = document.createElement("div"); nm.className = "nm";
    const strong = document.createElement("strong"); strong.textContent = a.name;
    const role = document.createElement("span"); role.className = "role"; role.textContent = a.role;
    nm.append(strong, role);
    const chip = document.createElement("span"); chip.className = "chip";
    const now = document.createElement("div"); now.className = "now";
    el.append(pc, nm, chip, now);
    $("team").appendChild(el);
    cards[a.id] = { chip, now };
  });

  function render() {
    const s = shown, A = agentsOf(s);
    TEAM.forEach(a => {
      const st = A[a.id].state, c = cards[a.id];
      c.chip.textContent = stateLabel(st, a.fem); c.chip.dataset.tone = STATES[st].tone;
      c.now.textContent = st === "idle" ? a.does : (A[a.id].step || LINES[a.id][st] || "");
    });
    const any = TEAM.map(a => A[a.id].state);
    const overall = any.find(x => WORK.includes(x)) || (any.includes("error") ? "error" : any.includes("done") ? "done" : "idle");
    $("chip").textContent = overall === "idle" ? "Свободны" : overall === "done" ? "Готово" : overall === "error" ? "Нужна помощь" : "Работают";
    $("chip").dataset.tone = STATES[overall].tone;
    $("when").textContent = demo ? "демонстрация" : ago(s.updatedAt);
    $("task").textContent = s.task || "Пока задач не было. Позовите Авзала в Claude Code, и команда сядет за работу.";
    $("sumBox").hidden = !s.summary;
    $("summary").textContent = s.summary || "";
    const chain = $("chain"); chain.textContent = "";
    const verbs = { avzal: "ищет фонды", vika: "проверяет", khomyak: "план портфеля" };
    TEAM.forEach((a, i) => {
      const st = A[a.id].state;
      const sTone = WORK.includes(st) ? "work" : st === "done" ? "ok" : st === "error" ? "bad" : "idle";
      const el = document.createElement("span"); el.className = "link"; el.dataset.s = sTone;
      const ic = document.createElement("i"); ic.textContent = { work: "●", ok: "✓", bad: "!", idle: "○" }[sTone];
      el.append(ic, document.createTextNode(`${a.name}: ${verbs[a.id]}`));
      if (i) { const ar = document.createElement("span"); ar.className = "arrow"; ar.textContent = "→"; chain.appendChild(ar); }
      chain.appendChild(el);
    });
    $("demoTag").hidden = !demo;
    const list = demo ? demo.log : logEntries;
    const ol = $("log"); ol.textContent = "";
    if (!list.length) {
      const li = document.createElement("li"); li.className = "empty";
      li.textContent = "Здесь появятся шаги команды: что Авзал искал, что Вика проверила и что Хомяк посчитал.";
      ol.appendChild(li);
    } else list.slice(0, 40).forEach(e => {
      const { who, text } = whoOf(e);
      const li = document.createElement("li");
      const tm = document.createElement("time"); const d = new Date(e.t);
      tm.textContent = isNaN(d) ? "" : d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      const tx = document.createElement("span"); tx.className = "txt";
      const w = document.createElement("span"); w.className = "who"; w.style.setProperty("--who", BY[who].color); w.textContent = BY[who].name;
      const stl = document.createElement("span"); stl.className = "st"; stl.textContent = STATES[e.state] ? ` · ${stateLabel(e.state, BY[who].fem).toLowerCase()}: ` : ": ";
      tx.append(w, stl, document.createTextNode(text));
      li.append(tm, tx); ol.appendChild(li);
    });
  }

  // ---------- demo: the whole team chain ----------
  const DEMO = [
    ["avzal", "search", "Смотрю котировки паёв на Мосбирже…"],
    ["avzal", "read", "Беру с полки отчёты управляющих компаний"],
    ["avzal", "analyze", "Рисую дисконты на флипчарте"],
    ["avzal", "write", "Пишу вывод с источниками"],
    ["avzal", "done", "Готово! Несу отчёт Вике"],
    ["vika", "read", "Сверяю цены с Мосбиржей под лупой"],
    ["vika", "analyze", "Пересчитываю дисконт и доходность"],
    ["vika", "write", "Пишу вердикт: можно с поправками"],
    ["vika", "done", "Проверила! Передаю Хомяку"],
    ["khomyak", "analyze", "Считаю доли портфеля и выплаты"],
    ["khomyak", "write", "Составляю план: две лимитные заявки"],
    ["khomyak", "done", "План готов!"],
  ];
  function startDemo() {
    clearTimeout(demo && demo.timer);
    const agents = {}; TEAM.forEach(a => agents[a.id] = { state: "idle", step: "" });
    demo = { i: 0, log: [], timer: null, agents };
    const tick = () => {
      if (demo.i >= DEMO.length) { demo.timer = setTimeout(() => { demo = null; shown = live; render(); }, 6000); return; }
      const [who, state, step] = DEMO[demo.i++];
      demo.agents = { ...demo.agents, [who]: { state, step } };
      demo.log.unshift({ t: new Date().toISOString(), state, text: step, who });
      shown = { state, step, agent: who, agents: demo.agents, task: "Пример: какой ЗПИФ купить, проверить вывод и встроить в портфель", summary: who === "khomyak" && state === "done" ? "Это демонстрация. Настоящий итог появится здесь, когда вы позовёте команду." : "", updatedAt: null };
      render();
      demo.timer = setTimeout(tick, state === "done" ? 7000 : 5000);
    };
    tick();
  }
  $("demoBtn").addEventListener("click", startDemo);

  // ---------- live data ----------
  async function connect() {
    let db = null;
    try { db = await window.claude?.use?.("db"); } catch (_) {}
    if (!db) { $("conn").textContent = "Нет связи с офисом, показываю последнее известное состояние."; return; }
    $("conn").textContent = "На связи";
    db.doc("office/status").onSnapshot(snap => {
      if (snap.exists) live = Object.assign({ state: "idle", task: "", step: "", summary: "", updatedAt: null, agent: "avzal", agents: null }, snap.data());
      if (!demo) { shown = live; render(); }
    }, () => { $("conn").textContent = "Связь с офисом прервалась, обновите страницу."; });
    db.doc("office/log").onSnapshot(snap => {
      logEntries = snap.exists && Array.isArray(snap.data().entries) ? snap.data().entries : [];
      if (!demo) render();
    }, () => {});
  }

  render();
  requestAnimationFrame(frame);
  setInterval(() => { if (!demo) $("when").textContent = ago(shown.updatedAt); }, 30000);
  connect();
})();
</script>
